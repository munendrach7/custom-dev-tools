server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large pastes / responses to flow through the proxy.
    client_max_body_size 100m;

    # API Client backend (Python / FastAPI). All target-API calls are proxied
    # here server-side, so the browser never triggers CORS.
    location /client/ {
        proxy_pass http://api-client:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # JSON/JSONL viewer backend (Node / Express).
    location /api/ {
        proxy_pass http://jsonl-api:5178;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
